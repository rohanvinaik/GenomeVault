name: Absolute Path Guard

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check-absolute-paths:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Check for absolute paths
      run: |
        echo "Checking for absolute paths..."
        
        # Define patterns to check
        PATTERNS=(
          "/Users/"
          Path.home()
          "C:\\"
          "C:/"
          "/opt/genomevault"
          "/var/lib/genomevault"
        )
        
        # Files to check
        FILES=$(find . -type f \(           -name "*.py" -o           -name "*.sh" -o           -name "*.bash" -o           -name "*.yml" -o           -name "*.yaml" -o           -name "*.md"         \) | grep -v node_modules | grep -v venv | grep -v .git)
        
        # Check each pattern
        FOUND=0
        for pattern in "${PATTERNS[@]}"; do
          echo "Checking for: $pattern"
          if grep -r "$pattern" $FILES 2>/dev/null; then
            echo "❌ Found absolute path: $pattern"
            FOUND=1
          fi
        done
        
        if [ $FOUND -eq 1 ]; then
          echo "❌ Absolute paths detected! Please use relative or environment-based paths."
          exit 1
        else
          echo "✅ No absolute paths found"
        fi
    
    - name: Run path checking script
      run: |
        if [ -f scripts/check_paths.py ]; then
          python3 scripts/check_paths.py
        fi
