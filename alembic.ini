# Alembic Configuration for GenomeVault Database Migrations

[alembic]
# Path to migration scripts
script_location = genomevault/migrations

# Template used to generate migration file names
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s

# Timezone to use when rendering the date within the migration file
timezone = UTC

# Max length of characters to apply to the "slug" field
truncate_slug_length = 40

# Set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
sourceless = false

# Version location specification
version_locations = %(here)s/genomevault/migrations/versions

# Version path separator
version_path_separator = os  # Use os.pathsep.

# Set to 'true' to search source files recursively
# in each "version_locations" directory
recursive_version_locations = false

# The output encoding used when revision files
# are written from script.py.mako
output_encoding = utf-8

# Database URL - will be overridden by env.py from environment variable
sqlalchemy.url = postgresql://user:password@localhost/genomevault

# Configure automatic detection of changes
[alembic:autogenerate]
# Detect table adds, drops, and changes
compare_type = true
compare_server_default = true

# Detect column adds, drops, and changes
detect_column_additions = true
detect_column_removals = true
detect_column_renames = true

# Detect index and constraint changes
detect_index_additions = true
detect_index_removals = true
detect_index_renames = true

# Detect sequence changes
detect_sequence_additions = true
detect_sequence_removals = true

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic,genomevault

[handlers]
keys = console,file

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console,file
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[logger_genomevault]
level = INFO
handlers = console,file
qualname = genomevault.migrations
propagate = 0

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[handler_file]
class = FileHandler
args = ('logs/migrations.log', 'a')
level = INFO
formatter = generic

[formatter_generic]
format = %(asctime)s %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S
