---
# ServiceAccount for GenomeVault services
apiVersion: v1
kind: ServiceAccount
metadata:
  name: genomevault-service
  namespace: genomevault
  labels:
    app: genomevault

---
# ClusterRole for GenomeVault operators
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: genomevault-operator
  labels:
    app: genomevault
rules:
- apiGroups: [""]
  resources: ["pods", "services", "configmaps", "secrets", "persistentvolumeclaims"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["apps"]
  resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["batch"]
  resources: ["jobs", "cronjobs"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["autoscaling"]
  resources: ["horizontalpodautoscalers"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["networking.k8s.io"]
  resources: ["networkpolicies", "ingresses"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["policy"]
  resources: ["poddisruptionbudgets"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
- apiGroups: ["coordination.k8s.io"]
  resources: ["leases"]
  verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
# ClusterRoleBinding
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: genomevault-operator-binding
  labels:
    app: genomevault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: genomevault-operator
subjects:
- kind: ServiceAccount
  name: genomevault-service
  namespace: genomevault

---
# Role for node operations within namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: genomevault-node-role
  namespace: genomevault
  labels:
    app: genomevault
rules:
- apiGroups: [""]
  resources: ["pods", "pods/log", "pods/exec"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["configmaps", "secrets"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["services", "endpoints"]
  verbs: ["get", "list", "watch"]

---
# RoleBinding for nodes
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: genomevault-node-binding
  namespace: genomevault
  labels:
    app: genomevault
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: genomevault-node-role
subjects:
- kind: ServiceAccount
  name: genomevault-service
  namespace: genomevault
