---
# Main configuration ConfigMap
apiVersion: v1
kind: ConfigMap
metadata:
  name: genomevault-config
  namespace: genomevault
  labels:
    app: genomevault
data:
  # Network Configuration
  network_id: "genomevault-mainnet"
  chain_id: "genomevault-1"
  genesis_time: "2024-01-01T00:00:00Z"
  
  # Node Configuration
  min_gas_price: "0.0001ugeno"
  pruning: "custom"
  pruning_keep_recent: "100"
  pruning_keep_every: "1000"
  pruning_interval: "10"
  
  # P2P Configuration
  p2p_max_num_inbound_peers: "40"
  p2p_max_num_outbound_peers: "10"
  p2p_seed_mode: "false"
  p2p_private_peer_ids: ""
  
  # Consensus Configuration
  consensus_timeout_propose: "3s"
  consensus_timeout_propose_delta: "500ms"
  consensus_timeout_prevote: "1s"
  consensus_timeout_prevote_delta: "500ms"
  consensus_timeout_precommit: "1s"
  consensus_timeout_precommit_delta: "500ms"
  consensus_timeout_commit: "5s"
  
  # Privacy Configuration
  privacy_mode: "enhanced"
  differential_privacy_epsilon: "1.0"
  differential_privacy_delta: "1e-5"
  homomorphic_encryption: "CKKS"
  
  # HDC Configuration
  hypervector_dimension: "10000"
  hypervector_similarity_threshold: "0.85"
  compression_tier_default: "clinical"
  
  # Storage Configuration
  storage_backend: "s3"
  storage_endpoint: "s3.amazonaws.com"
  storage_region: "us-east-1"
  storage_bucket: "genomevault-data"
  
  # Monitoring
  telemetry_enabled: "true"
  telemetry_service_name: "genomevault"
  telemetry_enable_hostname: "true"
  telemetry_enable_hostname_label: "true"
  telemetry_enable_service_label: "true"
  prometheus_retention_time: "60"

---
# Node tier configurations
apiVersion: v1
kind: ConfigMap
metadata:
  name: genomevault-node-config
  namespace: genomevault
  labels:
    app: genomevault
data:
  # Light Node Configuration
  light.toml: |
    [node]
    type = "light"
    voting_power = 1
    max_memory_gb = 8
    max_cpu_cores = 4
    storage_limit_gb = 500
    
    [features]
    enable_api = false
    enable_grpc = false
    enable_websocket = false
    enable_archive = false
    enable_indexing = false
    
    [performance]
    cache_size_mb = 512
    batch_size = 100
    worker_threads = 2
  
  # Full Node Configuration
  full.toml: |
    [node]
    type = "full"
    voting_power = 4
    max_memory_gb = 64
    max_cpu_cores = 16
    storage_limit_gb = 4000
    
    [features]
    enable_api = true
    enable_grpc = true
    enable_websocket = false
    enable_archive = false
    enable_indexing = true
    
    [performance]
    cache_size_mb = 16384
    batch_size = 1000
    worker_threads = 8
  
  # Archive Node Configuration
  archive.toml: |
    [node]
    type = "archive"
    voting_power = 8
    max_memory_gb = 256
    max_cpu_cores = 48
    storage_limit_gb = 100000
    
    [features]
    enable_api = true
    enable_grpc = true
    enable_websocket = true
    enable_archive = true
    enable_indexing = true
    enable_historical_queries = true
    
    [performance]
    cache_size_mb = 65536
    batch_size = 10000
    worker_threads = 16
    
    [archive]
    prune_nothing = true
    index_everything = true
    snapshot_interval = 1000
    compression_level = 9

---
# API Gateway Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: genomevault-api-config
  namespace: genomevault
  labels:
    app: genomevault
    component: api-gateway
data:
  api_config.yaml: |
    server:
      host: 0.0.0.0
      port: 8000
      workers: 4
      keepalive: 75
      
    cors:
      enabled: true
      allow_origins: ["*"]
      allow_methods: ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
      allow_headers: ["*"]
      expose_headers: ["X-Request-ID", "X-Rate-Limit-*"]
      
    rate_limiting:
      enabled: true
      default_limit: 1000
      default_window: 60
      tiers:
        free: 100
        basic: 1000
        premium: 10000
        enterprise: 50000
        
    authentication:
      jwt_enabled: true
      jwt_algorithm: "RS256"
      jwt_expiry_seconds: 3600
      refresh_token_expiry_seconds: 604800
      oauth2_enabled: true
      mfa_enabled: true
      
    logging:
      level: INFO
      format: json
      output: stdout
      
    tracing:
      enabled: true
      sampling_rate: 0.1
      exporter: jaeger

---
# PIR Server Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: genomevault-pir-config
  namespace: genomevault
  labels:
    app: genomevault
    component: pir-server
data:
  pir_config.json: |
    {
      "mode": "IT_PIR",
      "servers": 3,
      "database": {
        "size_gb": 100,
        "block_size_kb": 4,
        "cache_size_gb": 8
      },
      "query": {
        "max_size_mb": 10,
        "timeout_seconds": 30,
        "batch_size": 100,
        "enable_batching": true
      },
      "security": {
        "information_theoretic": true,
        "threshold": 2,
        "xor_shares": true
      },
      "performance": {
        "parallel_queries": 10,
        "worker_threads": 8,
        "use_gpu": false
      }
    }

---
# Federated Learning Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: genomevault-federated-config
  namespace: genomevault
  labels:
    app: genomevault
    component: federated-coordinator
data:
  federated_config.yaml: |
    coordinator:
      mode: primary
      backup_coordinators: 1
      
    protocol:
      aggregation: SECAGG
      homomorphic_encryption: CKKS
      secure_multiparty: true
      
    privacy:
      differential_privacy:
        enabled: true
        epsilon: 1.0
        delta: 1e-5
        noise_multiplier: 1.1
        max_grad_norm: 1.0
      privacy_budget: 10.0
      composition_method: renyi
      
    training:
      min_participants: 3
      max_participants: 100
      dropout_tolerance: 0.3
      round_timeout_seconds: 300
      max_rounds: 100
      convergence_threshold: 0.001
      checkpoint_interval: 10
      
    selection:
      strategy: fair
      reputation_weight: 0.3
      availability_weight: 0.3
      performance_weight: 0.4
      
    incentives:
      enabled: true
      base_reward: 100
      quality_bonus: 50
      participation_bonus: 25

---
# Monitoring Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: genomevault-monitoring-config
  namespace: genomevault
  labels:
    app: genomevault
    component: monitoring
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
      
    scrape_configs:
    - job_name: 'genomevault-nodes'
      kubernetes_sd_configs:
      - role: pod
        namespaces:
          names:
          - genomevault
      relabel_configs:
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_scrape]
        action: keep
        regex: true
      - source_labels: [__meta_kubernetes_pod_annotation_prometheus_io_path]
        action: replace
        target_label: __metrics_path__
        regex: (.+)
      - source_labels: [__address__, __meta_kubernetes_pod_annotation_prometheus_io_port]
        action: replace
        regex: ([^:]+)(?::\d+)?;(\d+)
        replacement: $1:$2
        target_label: __address__
      - action: labelmap
        regex: __meta_kubernetes_pod_label_(.+)
      - source_labels: [__meta_kubernetes_namespace]
        action: replace
        target_label: kubernetes_namespace
      - source_labels: [__meta_kubernetes_pod_name]
        action: replace
        target_label: kubernetes_pod_name
  
  alerts.yml: |
    groups:
    - name: genomevault
      interval: 30s
      rules:
      - alert: HighLatency
        expr: genomevault_pir_query_latency_milliseconds > 1000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High PIR query latency"
          description: "PIR query latency {{ $value }}ms exceeds threshold"
      
      - alert: PrivacyBreach
        expr: genomevault_privacy_breach_probability > 0.0001
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Privacy breach risk detected"
          description: "Privacy breach probability {{ $value }} exceeds threshold"
      
      - alert: LowCompression
        expr: genomevault_compression_ratio < 100
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Low compression ratio"
          description: "Compression ratio {{ $value }} below target"
      
      - alert: NodeDown
        expr: up{job="genomevault-nodes"} == 0
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "GenomeVault node is down"
          description: "Node {{ $labels.instance }} has been down for more than 5 minutes"