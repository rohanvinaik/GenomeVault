---
# Light Node Deployment - 4 cores, 8GB RAM, 500GB storage
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: genomevault-light-node
  namespace: genomevault
  labels:
    app: genomevault
    tier: light
    component: node
spec:
  serviceName: genomevault-light-node
  replicas: 3
  selector:
    matchLabels:
      app: genomevault
      tier: light
      component: node
  template:
    metadata:
      labels:
        app: genomevault
        tier: light
        component: node
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: genomevault-service
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: tier
                  operator: In
                  values: ["light"]
              topologyKey: kubernetes.io/hostname
      initContainers:
      - name: init-chain
        image: genomevault/init:latest
        imagePullPolicy: IfNotPresent
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Initializing blockchain data..."
          mkdir -p /data/blockchain
          mkdir -p /data/hypervectors
          mkdir -p /data/proofs
          echo "Initialization complete"
        volumeMounts:
        - name: data
          mountPath: /data
      containers:
      - name: light-node
        image: genomevault/light-node:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        - containerPort: 26656
          name: p2p
          protocol: TCP
        - containerPort: 26657
          name: rpc
          protocol: TCP
        env:
        - name: NODE_TYPE
          value: "light"
        - name: NODE_CLASS
          value: "LIGHT"
        - name: VOTING_POWER
          value: "1"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        envFrom:
        - configMapRef:
            name: genomevault-config
        - secretRef:
            name: genomevault-secrets
        resources:
          requests:
            cpu: "4"
            memory: "8Gi"
            ephemeral-storage: "10Gi"
          limits:
            cpu: "4"
            memory: "8Gi"
            ephemeral-storage: "20Gi"
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /etc/genomevault
          readOnly: true
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
      - name: config
        configMap:
          name: genomevault-node-config
  volumeClaimTemplates:
  - metadata:
      name: data
      labels:
        app: genomevault
        tier: light
    spec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: fast-ssd
      resources:
        requests:
          storage: 500Gi

---
# Service for Light Nodes
apiVersion: v1
kind: Service
metadata:
  name: genomevault-light-node
  namespace: genomevault
  labels:
    app: genomevault
    tier: light
    component: node
spec:
  type: ClusterIP
  clusterIP: None  # Headless service for StatefulSet
  selector:
    app: genomevault
    tier: light
    component: node
  ports:
  - name: http
    port: 8080
    targetPort: 8080
  - name: metrics
    port: 9090
    targetPort: 9090
  - name: p2p
    port: 26656
    targetPort: 26656
  - name: rpc
    port: 26657
    targetPort: 26657

---
# HorizontalPodAutoscaler for Light Nodes
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: genomevault-light-node-hpa
  namespace: genomevault
  labels:
    app: genomevault
    tier: light
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: genomevault-light-node
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 60

---
# PodDisruptionBudget for Light Nodes
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: genomevault-light-node-pdb
  namespace: genomevault
  labels:
    app: genomevault
    tier: light
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: genomevault
      tier: light
      component: node