---
# Auto-scaling Operator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genomevault-autoscaler-operator
  namespace: genomevault
  labels:
    app: genomevault
    component: autoscaler-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: genomevault
      component: autoscaler-operator
  template:
    metadata:
      labels:
        app: genomevault
        component: autoscaler-operator
    spec:
      serviceAccountName: genomevault-service
      containers:
      - name: autoscaler
        image: genomevault/autoscaler-operator:latest
        imagePullPolicy: IfNotPresent
        env:
        - name: OPERATOR_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: ENABLE_WEBHOOKS
          value: "false"
        - name: METRICS_ADDR
          value: ":8080"
        - name: LEADER_ELECTION
          value: "true"
        command:
        - /manager
        args:
        - --leader-elect
        - --health-probe-bind-address=:8081
        - --metrics-bind-address=:8080
        resources:
          requests:
            cpu: "500m"
            memory: "512Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10

---
# Custom Resource Definition for AutoScaling
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: autoscalers.genomevault.io
spec:
  group: genomevault.io
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              targetRef:
                type: object
                properties:
                  apiVersion:
                    type: string
                  kind:
                    type: string
                  name:
                    type: string
              minReplicas:
                type: integer
                minimum: 1
              maxReplicas:
                type: integer
                minimum: 1
              metrics:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                      enum: ["cpu", "memory", "custom"]
                    target:
                      type: object
                      properties:
                        type:
                          type: string
                        value:
                          type: string
              behavior:
                type: object
                properties:
                  scaleUp:
                    type: object
                    properties:
                      stabilizationWindowSeconds:
                        type: integer
                      policies:
                        type: array
                        items:
                          type: object
                  scaleDown:
                    type: object
                    properties:
                      stabilizationWindowSeconds:
                        type: integer
                      policies:
                        type: array
                        items:
                          type: object
          status:
            type: object
            properties:
              currentReplicas:
                type: integer
              desiredReplicas:
                type: integer
              lastScaleTime:
                type: string
  scope: Namespaced
  names:
    plural: autoscalers
    singular: autoscaler
    kind: AutoScaler

---
# AutoScaler for Light Nodes
apiVersion: genomevault.io/v1
kind: AutoScaler
metadata:
  name: light-node-autoscaler
  namespace: genomevault
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: genomevault-light-node
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: cpu
    target:
      type: Utilization
      value: "70"
  - type: memory
    target:
      type: Utilization
      value: "80"
  - type: custom
    target:
      type: Value
      value: "1000"  # Requests per second
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60

---
# AutoScaler for Full Nodes
apiVersion: genomevault.io/v1
kind: AutoScaler
metadata:
  name: full-node-autoscaler
  namespace: genomevault
spec:
  targetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: genomevault-full-node
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: cpu
    target:
      type: Utilization
      value: "60"
  - type: memory
    target:
      type: Utilization
      value: "70"
  - type: custom
    target:
      type: Value
      value: "500"  # Queries per second
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
      - type: Pods
        value: 2
        periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      policies:
      - type: Pods
        value: 1
        periodSeconds: 120

---
# Vertical Pod Autoscaler for resource optimization
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: genomevault-vpa
  namespace: genomevault
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: genomevault-api-gateway
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: api-gateway
      minAllowed:
        cpu: 1
        memory: 2Gi
      maxAllowed:
        cpu: 8
        memory: 16Gi
      controlledResources: ["cpu", "memory"]

---
# Cluster Autoscaler Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: cluster-autoscaler-config
  namespace: kube-system
  labels:
    app: cluster-autoscaler
data:
  nodes.yaml: |
    nodeGroups:
      - name: light-nodes
        minSize: 3
        maxSize: 20
        instanceType: t3.xlarge
        labels:
          genomevault/node-class: light
        taints:
          - key: genomevault/light-node
            value: "true"
            effect: NoSchedule

      - name: full-nodes
        minSize: 2
        maxSize: 10
        instanceType: m5.4xlarge
        labels:
          genomevault/node-class: full
        taints:
          - key: genomevault/full-node
            value: "true"
            effect: NoSchedule

      - name: archive-nodes
        minSize: 1
        maxSize: 3
        instanceType: m5.16xlarge
        labels:
          genomevault/node-class: archive
        taints:
          - key: genomevault/archive-node
            value: "true"
            effect: NoSchedule

      - name: compute-nodes
        minSize: 2
        maxSize: 50
        instanceType: c5.4xlarge
        labels:
          genomevault/node-class: compute
        spotInstance: true
        spotPrice: 0.5
