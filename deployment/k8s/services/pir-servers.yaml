---
# PIR Server Deployment for private information retrieval
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genomevault-pir-server
  namespace: genomevault
  labels:
    app: genomevault
    component: pir-server
    tier: compute
spec:
  replicas: 3
  selector:
    matchLabels:
      app: genomevault
      component: pir-server
  template:
    metadata:
      labels:
        app: genomevault
        component: pir-server
        tier: compute
        version: v1.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: genomevault-service
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: component
                operator: In
                values: ["pir-server"]
            topologyKey: kubernetes.io/hostname
      containers:
      - name: pir-server
        image: genomevault/pir-server:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8100
          name: pir
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: PIR_MODE
          value: "IT_PIR"  # Information-Theoretic PIR
        - name: DATABASE_SIZE_GB
          value: "100"
        - name: CACHE_SIZE_GB
          value: "8"
        - name: MAX_QUERY_SIZE_MB
          value: "10"
        - name: ENABLE_BATCHING
          value: "true"
        - name: BATCH_SIZE
          value: "100"
        - name: LOG_LEVEL
          value: "INFO"
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        envFrom:
        - configMapRef:
            name: genomevault-pir-config
        - secretRef:
            name: genomevault-pir-secrets
        resources:
          requests:
            cpu: "8"
            memory: "32Gi"
            ephemeral-storage: "50Gi"
          limits:
            cpu: "16"
            memory: "64Gi"
            ephemeral-storage: "100Gi"
        volumeMounts:
        - name: pir-data
          mountPath: /data
        - name: pir-cache
          mountPath: /cache
        livenessProbe:
          httpGet:
            path: /health
            port: 8100
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /ready
            port: 8100
          initialDelaySeconds: 15
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: pir-data
        persistentVolumeClaim:
          claimName: pir-data-pvc
      - name: pir-cache
        emptyDir:
          sizeLimit: 10Gi

---
# Service for PIR Servers
apiVersion: v1
kind: Service
metadata:
  name: genomevault-pir
  namespace: genomevault
  labels:
    app: genomevault
    component: pir-server
spec:
  type: ClusterIP
  selector:
    app: genomevault
    component: pir-server
  ports:
  - name: pir
    port: 8100
    targetPort: 8100
  - name: metrics
    port: 9090
    targetPort: 9090

---
# HorizontalPodAutoscaler for PIR Servers
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: genomevault-pir-hpa
  namespace: genomevault
  labels:
    app: genomevault
    component: pir-server
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: genomevault-pir-server
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 60
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 70
  - type: Pods
    pods:
      metric:
        name: pir_query_rate
      target:
        type: AverageValue
        averageValue: "1000"
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30

---
# PersistentVolumeClaim for PIR Data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pir-data-pvc
  namespace: genomevault
  labels:
    app: genomevault
    component: pir-server
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: fast-ssd
  resources:
    requests:
      storage: 500Gi
