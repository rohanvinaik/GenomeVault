apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

metadata:
  name: genomevault-canary
  annotations:
    deployment.kubernetes.io/revision: "1"

namespace: genomevault

resources:
  - canary-deployment.yaml
  - canary-service.yaml
  - virtual-service.yaml
  - destination-rule.yaml
  - service-monitor.yaml

images:
  - name: genomevault
    newTag: latest

replicas:
  - name: genomevault-api-canary
    count: 2

patchesStrategicMerge:
  - deployment-patch.yaml

configMapGenerator:
  - name: canary-config
    literals:
      - CANARY_ENABLED=true
      - DEPLOYMENT_TYPE=canary
      - TRAFFIC_PERCENTAGE=5
      - ROLLBACK_THRESHOLD_P95=500
      - ROLLBACK_THRESHOLD_ERROR_RATE=0.01

commonLabels:
  app: genomevault
  component: api
  deployment: canary

commonAnnotations:
  deployment.genomevault.io/canary: "true"
  deployment.genomevault.io/traffic-split: "5%"
