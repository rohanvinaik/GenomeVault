---
# ConfigMap for PIR server configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: pir-server-config
  namespace: pir-server-1
data:
  config.yaml: |
    server:
      database_size: 1000000
      block_size: 1024
      num_servers: 3
      security_parameter: 128
      constant_time_ns: 10000000
      max_query_age: 60
      response_padding_size: 1024
      
    byzantine:
      enabled: true
      min_servers: 2
      error_correction_symbols: 10
      reputation_threshold: 0.7
      
    monitoring:
      enabled: true
      metrics_port: 9090
      health_port: 8081
      
    security:
      enable_tls: true
      require_client_cert: false
      enable_replay_protection: true
      nonce_cache_size: 10000
