---
# PIR Server 1 Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pir-server-1
  namespace: pir-server-1
  labels:
    app: pir-server
    server-id: "1"
    trust-domain: "domain-1"
spec:
  replicas: 2  # HA within same trust domain
  selector:
    matchLabels:
      app: pir-server
      server-id: "1"
  template:
    metadata:
      labels:
        app: pir-server
        server-id: "1"
        trust-domain: "domain-1"
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: pir-server
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      
      initContainers:
      # Initialize database
      - name: init-database
        image: genomevault/pir-init:latest
        command: ["/bin/sh", "-c"]
        args:
        - |
          echo "Initializing PIR database..."
          /app/init_database.sh
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config
          readOnly: true
      
      containers:
      - name: pir-server
        image: genomevault/pir-server:latest
        imagePullPolicy: IfNotPresent
        
        env:
        - name: SERVER_ID
          value: "1"
        - name: TRUST_DOMAIN
          value: "domain-1"
        - name: PORT
          value: "8080"
        - name: SECURE_PORT
          value: "8443"
        - name: METRICS_PORT
          value: "9090"
        - name: HEALTH_PORT
          value: "8081"
        - name: CONSTANT_TIME_MODE
          value: "true"
        - name: BYZANTINE_TOLERANCE
          value: "true"
        - name: RESPONSE_PADDING_SIZE
          value: "1024"  # 1KB blocks
        - name: MAX_QUERY_AGE
          value: "60"
        - name: LOG_LEVEL
          value: "INFO"
        
        ports:
        - name: http
          containerPort: 8080
          protocol: TCP
        - name: https
          containerPort: 8443
          protocol: TCP
        - name: metrics
          containerPort: 9090
          protocol: TCP
        - name: health
          containerPort: 8081
          protocol: TCP
        
        # Health checks
        livenessProbe:
          httpGet:
            path: /health/live
            port: health
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        
        readinessProbe:
          httpGet:
            path: /health/ready
            port: health
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 2
        
        startupProbe:
          httpGet:
            path: /health/startup
            port: health
          initialDelaySeconds: 0
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 30
        
        resources:
          requests:
            memory: "2Gi"
            cpu: "1000m"
          limits:
            memory: "4Gi"
            cpu: "2000m"
        
        volumeMounts:
        - name: data
          mountPath: /data
        - name: config
          mountPath: /config
          readOnly: true
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: keys
          mountPath: /keys
          readOnly: true
        
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      
      # Sidecar for monitoring
      - name: monitoring-agent
        image: genomevault/pir-monitor:latest
        env:
        - name: SERVER_ID
          value: "1"
        - name: MONITOR_PORT
          value: "9091"
        
        ports:
        - name: monitor
          containerPort: 9091
          protocol: TCP
        
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "200m"
        
        volumeMounts:
        - name: metrics
          mountPath: /metrics
      
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: pir-server-1-data
      - name: config
        configMap:
          name: pir-server-config
      - name: tls
        secret:
          secretName: pir-server-1-tls
      - name: keys
        secret:
          secretName: pir-server-1-keys
      - name: metrics
        emptyDir: {}
      
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
              - key: app
                operator: In
                values:
                - pir-server
              - key: server-id
                operator: NotIn
                values:
                - "1"
            topologyKey: kubernetes.io/hostname
---
