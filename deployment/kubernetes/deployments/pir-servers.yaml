---
# PIR Coordinator Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: pir-coordinator
  namespace: pir-coordinator
  labels:
    app: pir-coordinator
spec:
  replicas: 3  # HA coordinator
  selector:
    matchLabels:
      app: pir-coordinator
  template:
    metadata:
      labels:
        app: pir-coordinator
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
    spec:
      serviceAccountName: pir-coordinator
      
      containers:
      - name: coordinator
        image: genomevault/pir-coordinator:latest
        
        env:
        - name: PIR_SERVERS
          value: "pir-server-1.pir-server-1:8080,pir-server-2.pir-server-2:8080,pir-server-3.pir-server-3:8080"
        - name: MIN_SERVERS
          value: "2"  # Minimum servers for reconstruction
        - name: BYZANTINE_THRESHOLD
          value: "1"  # Tolerate 1 Byzantine server
        - name: ENABLE_CACHING
          value: "true"
        - name: CACHE_SIZE
          value: "1000"
        - name: ZK_VERIFICATION
          value: "true"
        
        ports:
        - name: http
          containerPort: 8080
        - name: https
          containerPort: 8443
        - name: metrics
          containerPort: 9090
        
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          periodSeconds: 10
        
        readinessProbe:
          httpGet:
            path: /ready
            port: 8080
          periodSeconds: 5
        
        resources:
          requests:
            memory: "1Gi"
            cpu: "500m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
