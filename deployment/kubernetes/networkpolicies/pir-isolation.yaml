          - pir-server-1
          - pir-server-2
    ports: []
---
# Coordinator network policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pir-coordinator-policy
  namespace: pir-coordinator
spec:
  podSelector:
    matchLabels:
      app: pir-coordinator
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Allow client connections
  - from:
    - namespaceSelector:
        matchLabels:
          name: genomevault
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  # Allow responses from PIR servers
  - from:
    - namespaceSelector:
        matchExpressions:
        - key: name
          operator: In
          values:
          - pir-server-1
          - pir-server-2
          - pir-server-3
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow queries to PIR servers
  - to:
    - namespaceSelector:
        matchExpressions:
        - key: name
          operator: In
          values:
          - pir-server-1
          - pir-server-2
          - pir-server-3
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  # Allow responses to clients
  - to:
    - namespaceSelector:
        matchLabels:
          name: genomevault
    ports:
    - protocol: TCP
---
# Default deny all for PIR namespaces
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: pir-server-1
spec:
  podSelector: {}
  policyTypes:
  - Ingress
  - Egress
