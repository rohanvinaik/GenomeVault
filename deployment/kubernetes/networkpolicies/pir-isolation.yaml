---
# Block inter-server communication explicitly
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: block-inter-server-communication
  namespace: pir-server-1
spec:
  podSelector:
    matchLabels:
      app: pir-server
  policyTypes:
  - Egress
  egress:
  # Explicitly deny traffic to other PIR servers
  - to:
    - namespaceSelector:
        matchExpressions:
        - key: name
          operator: In
          values:
          - pir-server-2
          - pir-server-3
    ports: []  # No ports allowed
---
apiVersion: networking.k8s.io/v1
