---
# Network isolation policies for PIR servers
# Ensures independent trust domains and prevents collusion
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: pir-server-1-isolation
  namespace: pir-server-1
spec:
  podSelector:
    matchLabels:
      app: pir-server
  policyTypes:
  - Ingress
  - Egress
  ingress:
  # Only allow traffic from coordinator
  - from:
    - namespaceSelector:
        matchLabels:
          name: pir-coordinator
      podSelector:
        matchLabels:
          app: pir-coordinator
    ports:
    - protocol: TCP
      port: 8080  # PIR query port
    - protocol: TCP
      port: 8443  # Secure PIR port
  # Allow health checks from monitoring
  - from:
    - namespaceSelector:
        matchLabels:
          name: genomevault-monitoring
    ports:
    - protocol: TCP
      port: 9090  # Metrics port
    - protocol: TCP
      port: 8081  # Health check port
  egress:
  # Allow DNS
  - to:
    - namespaceSelector:
        matchLabels:
          name: kube-system
    ports:
    - protocol: UDP
      port: 53
  # Allow response to coordinator
  - to:
    - namespaceSelector:
        matchLabels:
          name: pir-coordinator
    ports:
    - protocol: TCP
      port: 8080
    - protocol: TCP
      port: 8443
  # Block all other egress (especially to other PIR servers)
  - to:
    - ipBlock:
        cidr: 10.0.0.0/8
        except:
        - 10.0.1.0/24  # Coordinator subnet
    ports: []  # No ports allowed
---
