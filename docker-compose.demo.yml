version: '3.8'

services:
  # Database
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: genomevault
      POSTGRES_USER: genomevault
      POSTGRES_PASSWORD: genomevault_demo_2024
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U genomevault"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Cache
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # API Service
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: genomevault:latest
    ports:
      - "8000:8000"
    environment:
      - GENOMEVAULT_ENV=demo
      - DATABASE_URL=postgresql://genomevault:genomevault_demo_2024@postgres:5432/genomevault
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=demo_secret_key_not_for_production
      - PYTHONUNBUFFERED=1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    command: >
      sh -c "
        echo 'Waiting for database...' &&
        sleep 5 &&
        echo 'Running migrations...' &&
        python -m genomevault.migrations.run &&
        echo 'Starting API server...' &&
        uvicorn genomevault.api.app:app --host 0.0.0.0 --port 8000 --reload
      "
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ZK Prover Service
  prover:
    build:
      context: .
      dockerfile: Dockerfile.prover
    image: genomevault-prover:latest
    environment:
      - GENOMEVAULT_ENV=demo
      - REDIS_URL=redis://redis:6379
      - PROVER_MODE=mock  # Use 'real' with Circom installed
    depends_on:
      - redis
    volumes:
      - ./circuits:/app/circuits
    command: python -m genomevault.zk_proofs.service

  # Demo Runner
  demo:
    build:
      context: .
      dockerfile: Dockerfile
    image: genomevault:latest
    environment:
      - GENOMEVAULT_ENV=demo
      - API_URL=http://api:8000
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - ./demo_data:/app/demo_data
      - ./results:/app/results
    command: >
      sh -c "
        echo 'Waiting for API to be ready...' &&
        sleep 10 &&
        echo 'Running demo sequence...' &&
        python -m genomevault.demo.runner --api-url http://api:8000
      "

  # Monitoring (optional)
  prometheus:
    image: prom/prometheus:latest
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - ./deploy/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  redis_data:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: genomevault_network