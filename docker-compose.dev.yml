# Development override for docker-compose.yml
# Use with: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
version: '3.8'

services:
  # PostgreSQL Development Overrides
  postgres:
    ports:
      # Always expose PostgreSQL port for direct database access during development
      - "5432:5432"
    environment:
      # Use simplified credentials for development
      POSTGRES_DB: genomevault
      POSTGRES_USER: genome
      POSTGRES_PASSWORD: vault
      # Enable verbose logging for development
      POSTGRES_LOG_STATEMENT: "all"
      POSTGRES_LOG_MIN_DURATION_STATEMENT: "0"
    volumes:
      # Mount SQL scripts for easy development database setup
      - ./scripts/dev-seed.sql:/docker-entrypoint-initdb.d/dev-seed.sql:ro
      - ./scripts/test-fixtures.sql:/docker-entrypoint-initdb.d/test-fixtures.sql:ro
    command: >
      postgres
      -c log_statement=all
      -c log_min_duration_statement=0
      -c log_line_prefix='%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
      -c shared_preload_libraries=pg_stat_statements
      -c pg_stat_statements.track=all
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c work_mem=4MB
      -c maintenance_work_mem=64MB
      -c fsync=off
      -c synchronous_commit=off
      -c full_page_writes=off

  # Redis Development Overrides
  redis:
    ports:
      # Always expose Redis port for direct access during development
      - "6379:6379"
    environment:
      # Remove password requirement for development ease
      REDIS_PASSWORD: ""
    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save ""
      --appendonly no
      --loglevel debug

  # API Development Overrides
  api:
    build:
      target: development
      args:
        - INSTALL_DEV=true
    ports:
      # Expose additional ports for debugging and profiling
      - "8000:8000"
      - "5678:5678"  # Python debugger (debugpy)
      - "9091:9090"  # Metrics endpoint (avoid conflict with prometheus)
      - "8080:8080"  # Development dashboard
    environment:
      # Development-specific environment variables
      - ENVIRONMENT=development
      - GENOMEVAULT_ENV=development
      - GENOMEVAULT_LOG_LEVEL=DEBUG
      - GENOMEVAULT_API_DEBUG=true
      - GENOMEVAULT_RELOAD=true
      - GENOMEVAULT_PROFILING=true

      # Database with simplified development connection
      - DATABASE_URL=postgresql://genome:vault@postgres:5432/genomevault
      - GENOMEVAULT_DATABASE_URL=postgresql://genome:vault@postgres:5432/genomevault
      - DATABASE_LOG_LEVEL=INFO
      - DATABASE_ECHO=true
      - DATABASE_POOL_PRE_PING=true

      # Redis with simplified development connection (no password)
      - REDIS_URL=redis://redis:6379
      - GENOMEVAULT_REDIS_URL=redis://redis:6379
      - REDIS_LOG_LEVEL=DEBUG
      - REDIS_DECODE_RESPONSES=true

      # PIR Servers for development
      - PIR_SERVERS=http://pir-server-1:9001,http://pir-server-2:9002,http://pir-server-3:9003,http://pir-server-4:9004

      # Development features
      - ENABLE_CORS=true
      - ENABLE_DOCS=true
      - ENABLE_REDOC=true
      - ENABLE_OPENAPI=true

      # Performance profiling
      - ENABLE_PROFILER=true
      - PROFILER_OUTPUT_DIR=/app/profiler-output

      # Security - relaxed for development
      - GENOMEVAULT_SECURITY_LEVEL=64
      - RATE_LIMIT_RPS=100.0
      - RATE_LIMIT_BURST=200
      - JWT_EXPIRY_HOURS=24

      # Hypervector development settings - smaller for faster dev testing
      - GENOMEVAULT_HV_DIMENSION=1000
      - GENOMEVAULT_COMPRESSION_TIER=basic
      - GENOMEVAULT_MAX_VARIANTS=100

      # ZK Proofs development settings - smaller for faster dev
      - GENOMEVAULT_ZK_CIRCUIT_SIZE=512
      - GENOMEVAULT_ZK_VERIFICATION_TIMEOUT=60.0

      # Enable all monitoring in development
      - GENOMEVAULT_ENABLE_METRICS=true
      - GENOMEVAULT_ENABLE_TRACING=true
      - GENOMEVAULT_ENABLE_HEALTH_CHECKS=true

      # Python debugging
      - PYTHONDONTWRITEBYTECODE=1
      - PYTHONUNBUFFERED=1
      - PYTHONDEBUG=1

    volumes:
      # Mount source code for live reloading
      - .:/app:cached
      - /app/__pycache__
      - /app/.pytest_cache
      - ./logs:/app/logs:rw
      - ./profiler-output:/app/profiler-output:rw
      - ./test-data:/app/test-data:ro
      - ./docs:/app/docs:ro

      # Development tools volumes
      - ~/.gitconfig:/root/.gitconfig:ro
      - ~/.ssh:/root/.ssh:ro

    command: >
      sh -c "
        echo 'Starting development server with debugger support...' &&
        python -m debugpy --listen 0.0.0.0:5678 -m uvicorn genomevault.api.v1.app:app
        --host 0.0.0.0
        --port 8000
        --reload
        --reload-dir /app/genomevault
        --reload-exclude __pycache__
        --log-level debug
        --access-log
        --use-colors
      "

    # Development-specific health check with longer intervals
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/v1/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s

  # PIR Servers (1-4) for development
  pir-server-1:
    build:
      context: .
      dockerfile: Dockerfile.pir
    ports:
      - "9001:9001"
    environment:
      - PIR_SERVER_ID=1
      - PIR_SERVER_PORT=9001
      - PIR_DATABASE_PATH=/data/pir_db_1.bin
      - PIR_REGION=us-east
    volumes:
      - pir_data_1:/data
    restart: unless-stopped

  pir-server-2:
    build:
      context: .
      dockerfile: Dockerfile.pir
    ports:
      - "9002:9002"
    environment:
      - PIR_SERVER_ID=2
      - PIR_SERVER_PORT=9002
      - PIR_DATABASE_PATH=/data/pir_db_2.bin
      - PIR_REGION=us-west
    volumes:
      - pir_data_2:/data
    restart: unless-stopped

  pir-server-3:
    build:
      context: .
      dockerfile: Dockerfile.pir
    ports:
      - "9003:9003"
    environment:
      - PIR_SERVER_ID=3
      - PIR_SERVER_PORT=9003
      - PIR_DATABASE_PATH=/data/pir_db_3.bin
      - PIR_REGION=eu-central
    volumes:
      - pir_data_3:/data
    restart: unless-stopped

  pir-server-4:
    build:
      context: .
      dockerfile: Dockerfile.pir
    ports:
      - "9004:9004"
    environment:
      - PIR_SERVER_ID=4
      - PIR_SERVER_PORT=9004
      - PIR_DATABASE_PATH=/data/pir_db_4.bin
      - PIR_REGION=ap-southeast
    volumes:
      - pir_data_4:/data
    restart: unless-stopped

  # Local Blockchain (Hardhat) for development
  local-chain:
    build:
      context: ./blockchain
      dockerfile: Dockerfile
    ports:
      - "8545:8545"
    environment:
      - MNEMONIC=test test test test test test test test test test test junk
    command: ["npx", "hardhat", "node", "--hostname", "0.0.0.0"]
    volumes:
      - blockchain_data:/app/deployments
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8545"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ZK API Service for development
  zk-api:
    build:
      context: .
      dockerfile: Dockerfile.zk-api
    ports:
      - "8001:8001"
    environment:
      - ZK_CONFIG_PATH=/app/config/zk_config.yaml
      - LOG_LEVEL=DEBUG
      - MAX_WORKERS=2  # Reduced for development
    volumes:
      - ./config:/app/config:ro
      - zk_cache:/app/cache
    depends_on:
      - redis
      - postgres
    restart: unless-stopped

  # ZK Workers for development
  zk-worker:
    build:
      context: .
      dockerfile: Dockerfile.zk-worker
    environment:
      - ZK_CONFIG_PATH=/app/config/zk_config.yaml
      - REDIS_URL=redis://redis:6379
      - DATABASE_URL=postgresql://genome:vault@postgres:5432/genomevault
    volumes:
      - ./config:/app/config:ro
      - zk_cache:/app/cache
    depends_on:
      - redis
      - postgres
    deploy:
      replicas: 1  # Reduced for development
    restart: unless-stopped

  # Additional development services for database administration

  # PostgreSQL Admin Interface
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: genomevault_pgadmin
    restart: unless-stopped
    ports:
      - "8081:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@genomevault.dev
      PGADMIN_DEFAULT_PASSWORD: genomevault_pgadmin_dev
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres

  # Redis Admin Interface
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: genomevault_redis_commander
    restart: unless-stopped
    ports:
      - "8082:8081"
    environment:
      REDIS_HOSTS: "local:redis:6379:0:"
      HTTP_USER: admin
      HTTP_PASSWORD: genomevault_redis_commander_dev
    depends_on:
      - redis

  # Prometheus Monitoring for development
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--log.level=debug'  # More verbose for development
    restart: unless-stopped

  # Grafana Dashboards for development
  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=genomevault
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_LOG_LEVEL=debug  # More verbose for development
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    restart: unless-stopped

# Development-specific volumes with additional admin tools
volumes:
  pir_data_1:
  pir_data_2:
  pir_data_3:
  pir_data_4:
  blockchain_data:
  zk_cache:
  pgadmin_data:
  prometheus_data:
  grafana_data:
