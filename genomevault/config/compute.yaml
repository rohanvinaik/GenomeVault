# GenomeVault Compute Backend Configuration
#
# This file controls hardware acceleration settings
# Override via environment variables: GENOMEVAULT_BACKEND, GENOMEVAULT_OPTIMIZE_LATENCY

compute:
  # Global backend preference
  # Options: auto, cpu, metal, cuda
  # Default: auto (detects best available: Metal > CUDA > CPU)
  default_backend: "auto"

  # Optimize for latency (use CPU even if GPU available)
  # Set to true for production API endpoints
  optimize_latency: false

  # Component-specific overrides
  hdc_encoding:
    # Single sample encoding
    # Always use CPU for minimal latency (<10ms)
    single_sample: "cpu"

    # Batch encoding threshold
    # Use GPU only if batch_size > this threshold
    # Small batches (<100) have transfer overhead > compute savings
    batch_threshold: 100

    # Warn threshold
    # Warn if encoding >N samples on CPU (suggest GPU)
    large_batch_warning: 1000

    # Enable FAISS for CPU similarity search
    # For databases >100K, FAISS provides 10-100× speedup
    enable_faiss: true
    faiss_threshold: 100000

  similarity_search:
    # Small database threshold (<10K)
    # Use CPU for small databases (no GPU overhead justified)
    small_database_threshold: 10000
    small_database_backend: "cpu"

    # Large database (>=10K)
    # Prefer GPU if available (5-10× speedup)
    large_database_backend: "auto"

    # FAISS CPU indexing threshold
    # Use FAISS index for databases >N records
    faiss_cpu_threshold: 100000

  zk_proofs:
    # ALWAYS CPU-only
    # ZK proving is CPU-optimized by design
    # GPU provides <10% benefit for current circuit sizes (<1M constraints)
    backend: "cpu"

    # Maximum parallel proofs
    # Use multiprocessing for bulk proving
    max_parallel: 4

    # Never override this - ZK circuits are CPU-optimized
    allow_override: false

  pir:
    # ALWAYS CPU-only
    # PIR is network-bound, not compute-bound
    # GPU provides <20% improvement (not worth complexity)
    backend: "cpu"

    # Enable SIMD vectorization
    # Use optimized BLAS for polynomial operations
    enable_simd: true

    # Database sharding threshold
    # Shard databases >N records for better performance
    sharding_threshold: 1000000

    # Never override this - PIR is network-dominated
    allow_override: false

# Backend-specific settings
metal:
  # Apple Silicon specific settings
  # Enable unified memory optimizations
  use_unified_memory: true

  # Kernel compilation cache
  # Cache compiled Metal kernels for faster startup
  cache_kernels: true

cuda:
  # NVIDIA GPU specific settings

  # Default device ID
  # Set to GPU device index (0 for first GPU)
  device_id: 0

  # Enable pinned memory
  # Use pinned memory for faster CPU↔GPU transfers
  use_pinned_memory: true

  # Memory pool size (MB)
  # Pre-allocate GPU memory pool
  # Set to 0 for dynamic allocation
  memory_pool_mb: 1024

# Production deployment presets
# Override entire config with preset
presets:
  production_api:
    # Optimized for latency and predictability
    default_backend: "cpu"
    optimize_latency: true
    hdc_encoding:
      single_sample: "cpu"
      batch_threshold: 10000  # Never use GPU in production
    similarity_search:
      small_database_backend: "cpu"
      large_database_backend: "cpu"

  research_batch:
    # Optimized for throughput
    default_backend: "auto"
    optimize_latency: false
    hdc_encoding:
      single_sample: "cpu"
      batch_threshold: 100  # Use GPU for moderate batches
    similarity_search:
      small_database_backend: "cpu"
      large_database_backend: "auto"  # Prefer GPU

  edge_deployment:
    # Hospital servers with limited resources
    default_backend: "cpu"
    hdc_encoding:
      enable_faiss: true
      faiss_threshold: 50000  # More aggressive FAISS usage
    similarity_search:
      faiss_cpu_threshold: 50000

# NEW: Intelligent backend selection (experimental)
intelligent_mode:
  # Enable intelligent data-driven backend selection
  # Default: false (use config-based selection for backward compatibility)
  enabled: false

  # Decision thresholds for intelligent selection
  thresholds:
    small_data_samples: 100           # <100 samples → likely CPU optimal
    large_data_samples: 1000          # >1000 samples → GPU consideration
    gpu_warmup_cost_ms: 5.0           # GPU warmup overhead to factor in
    interactive_latency_target_ms: 100.0  # Target for real-time operations

  # Performance models (from GenomeVault benchmarks)
  # Used to predict CPU vs GPU execution time
  performance_models:
    hdc_encoding:
      cpu_time_per_sample_ms: 5.0     # 5ms per sample on CPU
      gpu_time_per_sample_ms: 0.5     # 0.5ms per sample on GPU (10× faster)
      gpu_warmup_ms: 5.0              # 5ms Metal/CUDA warmup
      batch_crossover_point: 100      # GPU faster when batch > 100

    similarity_search:
      cpu_time_per_1k_db_ms: 2.0      # 2ms per 1K database records on CPU
      gpu_time_per_1k_db_ms: 0.2      # 0.2ms per 1K on GPU (10× faster)
      database_crossover_point: 10000 # GPU faster for >10K database

  # Analysis type profiles (operation-specific hints)
  operation_profiles:
    clinical_query:
      latency_sensitive: true
      prefer_cpu: true
      reason: "Avoid GPU warmup for predictable sub-100ms latency"

    batch_validation:
      throughput_focused: true
      prefer_gpu: true
      min_samples_for_gpu: 100
      reason: "Maximize throughput for large batches"

    research_pipeline:
      prefer_gpu: true
      allow_longer_startup: true
      reason: "Optimize for total throughput, startup time acceptable"

# Environment variable overrides
# These take precedence over config file
#
# GENOMEVAULT_BACKEND: cpu, metal, cuda, auto
# GENOMEVAULT_OPTIMIZE_LATENCY: true, false
# GENOMEVAULT_PRESET: production_api, research_batch, edge_deployment
# GENOMEVAULT_INTELLIGENT_MODE: true, false (enable intelligent selection)
