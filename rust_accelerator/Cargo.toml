[package]
name = "genomevault-accelerator"
version = "0.1.0"
edition = "2021"
authors = ["GenomeVault Team"]
description = "High-performance Rust accelerator for GenomeVault hot paths"
license = "MIT"

[lib]
name = "genomevault_accel"
crate-type = ["cdylib"]

[dependencies]
# Python bindings
pyo3 = { version = "0.20", features = ["extension-module", "abi3-py38"] }
numpy = "0.20"

# Parallel processing
rayon = "1.7"
crossbeam = "0.8"

# Numerical computing
ndarray = { version = "0.15", features = ["rayon"] }
ndarray-rand = "0.14"
num-traits = "0.2"

# SIMD and low-level optimizations
packed_simd_2 = "0.3.8"
bytemuck = "1.14"

# Hashing and crypto
blake3 = "1.5"
sha2 = "0.10"

# Serialization
serde = { version = "1.0", features = ["derive"] }
bincode = "1.3"

[dev-dependencies]
criterion = "0.5"
proptest = "1.4"

[profile.release]
lto = true           # Link-time optimization
opt-level = 3        # Maximum optimization
codegen-units = 1    # Single codegen unit for better optimization
strip = true         # Strip symbols for smaller binary
panic = "abort"      # Smaller binary, no unwinding

[profile.bench]
inherits = "release"

[[bench]]
name = "hdc_benchmarks"
harness = false