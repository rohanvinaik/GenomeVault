[pytest]
# Pytest configuration for integration tests

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Markers for test categorization
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    requires_redis: marks tests that require Redis connection
    requires_postgres: marks tests that require PostgreSQL connection
    requires_docker: marks tests that require Docker
    async: marks tests as async/await tests

# Test output options
addopts = 
    -v
    --tb=short
    --strict-markers
    --disable-warnings
    --color=yes
    --maxfail=5
    --cov=genomevault.api
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-config=.coveragerc

# Async test configuration
asyncio_mode = auto

# Timeout for tests (in seconds)
timeout = 60
timeout_method = thread

# Logging configuration
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(name)s - %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Test paths
testpaths = .
norecursedirs = .git .tox dist build *.egg

# Ignore deprecation warnings from libraries
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
    ignore::FutureWarning
    ignore::UserWarning:fastapi
    ignore::UserWarning:pydantic

# Minimum Python version
minversion = 3.8